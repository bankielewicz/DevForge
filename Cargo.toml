[package]
name = "devforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local proof of concept for external project-expertise and development gates"
repository = "https://github.com/bankielewicz/DevForge"
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
